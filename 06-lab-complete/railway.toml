[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
# Railway cấp biến PORT; Dockerfile đã lắng nghe theo ${PORT}.
# AGENT_API_KEY và REDIS_URL đặt trong Railway Variables, không ghi ở đây.
